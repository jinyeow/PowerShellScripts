# Prerelease CI: analyzes, tests, packs the module and publishes the build
# artifact. Runs automatically on every commit to any branch.
trigger:
  branches:
    include:
      - '*'

parameters:
- name: additionalSparseCheckoutDirectories
  type: string
  default: ''
# Placeholder default so the CI trigger can run unattended; replace with your
# Azure service connection name (or override at queue time).
- name: azureServiceConnection
  type: string
  default: '<FILLME_AZURE_SERVICE_CONNECTION>'
# Placeholder default for the module to build; replace with your module name.
- name: moduleName
  type: string
  default: '<FILLME_MODULE_NAME>'
- name: testResultsOutFile
  type: string
  default: '$(Build.ArtifactStagingDirectory)/TestResults.xml'

variables:
  AZURE_SERVICE_CONNECTION: '${{ parameters.azureServiceConnection }}'
  CODE_COVERAGE_THRESHOLD: 10
  MODULE_NAME: '${{ parameters.moduleName }}'
  SPARSE_CHECKOUT_DIRECTORIES: '${{ variables.MODULE_NAME }} ${{ parameters.additionalSparseCheckoutDirectories }} .vscode'
  TEST_RESULTS: '${{ parameters.testResultsOutFile }}'

stages:
- stage: CI
  displayName: 'Run Pester Tests'
  jobs:
  - job: Test
    displayName: 'Test PowerShell Module'
    steps:
    - checkout: self
      displayName: '[Sparse] Checkout self'
      fetchDepth: 1
      sparseCheckoutDirectories: ${{ variables.SPARSE_CHECKOUT_DIRECTORIES }}

    - task: PowerShell@2
      displayName: 'PSScriptAnalyzer'
      inputs:
        pwsh: true
        failOnStderr: true
        targetType: 'inline'
        script:  |
          Install-Module -Name PSScriptAnalyzer -Force
          Import-Module PSScriptAnalyzer
          $params = @{
            Path = '${{ variables.MODULE_NAME }}/src'
            Recurse = $true
            Settings = '.vscode/PSScriptAnalyzerSettings.psd1'
            ReportSummary = $true
            EnableExit = $true
            IncludeSuppressed = $true
          }
          Invoke-ScriptAnalyzer @params

    - task: AzurePowerShell@5
      displayName: 'Run Pester Tests'
      inputs:
        azurePowerShellVersion: 'LatestVersion'
        azureSubscription: ${{ variables.AZURE_SERVICE_CONNECTION }}
        pwsh: true
        ScriptType: 'InlineScript'
        workingDirectory: $(MODULE_NAME)
        Inline:  |
          $graphToken = (Get-AzAccessToken -Resource 'https://graph.microsoft.com').Token |
            ConvertTo-SecureString -AsPlainText
          Connect-MgGraph -AccessToken $graphToken -NoWelcome

          # Install and import Pester if not already installed
          $requiredVersion = '5.0.0'
          $pesterModule = Get-Module -ListAvailable -Name Pester | Select-Object -First 1
          if (-not ($pesterModule) -or ($pesterModule.Version -lt $requiredVersion)) {
              Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion $requiredVersion -Force

          $config = New-PesterConfiguration

          # Test paths
          $config.Run.Path = "./tests"
          $config.Run.PassThru = $true

          # Code Coverage settings
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = 'coverage.xml'
          $config.CodeCoverage.Path = './src'
          $config.CodeCoverage.CoveragePercentTarget = ${{ variables.CODE_COVERAGE_THRESHOLD }}

          $config.Output.Verbosity = "Detailed"

          # Test Result output
          $config.TestResult.Enabled = $true
          $config.Run.Exit = $true
          $config.TestResult.OutputFormat = "NUnitXml"
          $config.TestResult.OutputPath = "$(TEST_RESULTS)"
          $config
          Invoke-Pester -Configuration $config

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      displayName: 'Publish Pester Test Results'
      inputs:
        failTaskOnFailedTests: true
        testResultsFiles: '$(TEST_RESULTS)'
        testResultsFormat: 'NUnit'
        testRunTitle: 'Pester Tests'

    - task: PublishCodeCoverageResults@2
      condition: succeededOrFailed()
      displayName: 'Publish Code Coverage'
      inputs:
        failIfCoverageEmpty: true
        summaryFileLocation: '**/coverage.xml'

  - job: Build
    displayName: 'Build PowerShell Module'
    steps:
    - checkout: self
      displayName: '[Sparse] Checkout self'
      fetchDepth: 1
      sparseCheckoutDirectories: ${{ variables.SPARSE_CHECKOUT_DIRECTORIES }} Utility

    # Every branch except main gets a unique, lexically-sortable prerelease label
    # stamped onto the manifest, so each build publishes a distinct prerelease
    # version (e.g. 1.2.0-prerelease0000000042). main is left untouched and
    # publishes the plain ModuleVersion. New-NuspecFromPsd.ps1 reads this
    # PrivateData.PSData.Prerelease field and appends it to the package version.
    - pwsh: |
        $moduleName = '${{ variables.MODULE_NAME }}'
        $manifestPath = "${moduleName}/src/${moduleName}.psd1"

        if ('$(Build.SourceBranch)' -eq 'refs/heads/main') {
          Write-Host "main branch: publishing release version (no prerelease label)."
        } else {
          # ModuleVersion must be 3-part and the label ASCII-alphanumeric starting
          # with a letter (SemVer v1 / PowerShellGet: no '.', no '+'). Zero-pad the
          # build id so the label sorts in build order.
          $label = 'prerelease{0:d10}' -f [long]'$(Build.BuildId)'
          Write-Host "Non-main branch: stamping prerelease label '$label' on $manifestPath"
          Update-ModuleManifest -Path $manifestPath -Prerelease $label
        }
      displayName: 'Stamp prerelease label (non-main branches)'

    - pwsh: |
        $moduleName = '${{ variables.MODULE_NAME }}'
        ./Utility/New-NuspecFromPsd.ps1 -ManifestPath "${moduleName}/src/${moduleName}.psd1" -DestinationFolder "${moduleName}/src"

        Write-Host "##[section]Reading generated nuspec:"
        Get-Content "${moduleName}/src/${moduleName}.nuspec"
      displayName: 'Generate nuspec from ${{ variables.MODULE_NAME }}.psd1'

    - task: NuGetToolInstaller@1
      inputs:
        checkLatest: true
        versionSpec: '*'

    - task: AzurePowerShell@5
      displayName: 'nuget pack'
      inputs:
        azurePowerShellVersion: 'LatestVersion'
        azureSubscription: ${{ variables.AZURE_SERVICE_CONNECTION }}
        FailOnStandardError: true
        pwsh: true
        ScriptType: 'InlineScript'
        workingDirectory: $(MODULE_NAME)
        Inline:  |
          nuget pack "src/${{ variables.MODULE_NAME }}.nuspec" -BasePath ./src -OutputDirectory '$(Build.ArtifactStagingDirectory)'
          ls $(Build.ArtifactStagingDirectory)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: "${{ variables.MODULE_NAME }}.nupkg"

  - job: PublishBuildArtifact
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), and(startsWith(variables['Build.SourceBranch'], 'refs/pull/'), endsWith(variables['Build.SourceBranch'], '/merge'))))
    dependsOn:
      - Test
      - Build
    displayName: 'Publish Build Artifact'
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: "${{ variables.MODULE_NAME }}.nupkg"
        path: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'publish build artifact'
      inputs:
        ArtifactName: '${{ variables.MODULE_NAME }}'
        PathtoPublish:  '$(Build.ArtifactStagingDirectory)'
