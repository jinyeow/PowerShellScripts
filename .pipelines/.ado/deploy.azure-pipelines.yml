# Publishes a packed PowerShell module to an Azure Artifacts feed.
# Manual-run only: it is never triggered by commits or PRs — queue it by hand
# when you want to promote a build. Replace the <FILLME_...> placeholders in the
# variables block below; the project is derived from a built-in variable.
trigger: none
pr: none

parameters:
- name: additionalSparseCheckoutDirectories
  type: string
  default: ''
- name: azureServiceConnection
  type: string
- name: moduleName
  type: string
- name: testResultsOutFile
  type: string
  default: '$(Build.ArtifactStagingDirectory)/TestResults.xml'

variables:
  # Placeholder — replace with your Azure DevOps organization name
  # (the '{org}' segment in https://dev.azure.com/{org}).
  ADO_ORGANIZATION: '<FILLME_ADO_ORGANIZATION>'
  # Placeholder — the Azure Artifacts feed name to publish to.
  ARTIFACT_FEED_NAME: '<FILLME_ARTIFACT_FEED_NAME>'
  # Base feed URL (host/org/project/feed), assembled from the org placeholder
  # above and the built-in project id. The v2 and v3 endpoints both hang off it.
  ARTIFACT_FEED_BASE: 'https://pkgs.dev.azure.com/$(ADO_ORGANIZATION)/$(System.TeamProjectId)/_packaging/$(ARTIFACT_FEED_NAME)'
  # NuGet v3 feed source used to push the package.
  ARTIFACT_FEED_URI: '$(ARTIFACT_FEED_BASE)/nuget/v3/index.json'
  AZURE_SERVICE_CONNECTION: '${{ parameters.azureServiceConnection }}'
  CI_IDENTIFIER: 'CI'
  CODE_COVERAGE_THRESHOLD: 10
  MODULE_NAME: '${{ parameters.moduleName }}'
  SPARSE_CHECKOUT_DIRECTORIES: '${{ variables.MODULE_NAME }} ${{ parameters.additionalSparseCheckoutDirectories }}'
  TEST_RESULTS: '${{ parameters.testResultsOutFile }}'

stages:
- stage: Deployment
  jobs:
  - job: deploy
    # No branch gate: the deploy publishes whatever was packed for the queued
    # branch — a release from main, a prerelease from any other branch — so it is
    # intentionally not restricted to main.
    displayName: Powershell Modules Deployment
    steps:
    - checkout: none

    - download: CI
      artifact: "${{ variables.MODULE_NAME }}"

    - task: NuGetToolInstaller@1
      inputs:
        versionSpec: '*'
        checkLatest: true

    - task: PowerShell@2
      displayName: 'Publish PowerShell Module to Azure Artifacts'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        targetType: 'inline'
        script: |
          $accessToken = $env:SYSTEM_ACCESSTOKEN
          $feedName = "${{ variables.ARTIFACT_FEED_NAME }}"
          $moduleName = "${{ variables.MODULE_NAME }}"
          $pkg = (Get-ChildItem *.nupkg).Name
          $sourceUri = "$(ARTIFACT_FEED_URI)"

          Write-Debug $sourceUri
          Write-Debug $pkg

          $nugetAddParams = @(
            '-Name', $feedName,
            '-Source', $sourceUri,
            '-username', $accessToken,
            '-password', $accessToken
          )
          nuget source add @nugetAddParams
          nuget push -Source $feedName -ApiKey AzureDevOpsService  "./$pkg" -SkipDuplicate
        workingDirectory: '$(Pipeline.Workspace)/${{ variables.CI_IDENTIFIER }}/${{ variables.MODULE_NAME }}'

- stage: PostDeploy
  dependsOn: Deployment
  displayName: 'Post Deployment Tasks'
  jobs:
  - job: Test
    displayName: 'Test deployed PowerShell module'
    steps:
    - checkout: none

    - task: NuGetToolInstaller@1
      inputs:
        versionSpec: '*'
        checkLatest: true

    - task: AzurePowerShell@5
      env:
        PROJECT_ID: $(System.TeamProjectId)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      displayName: '[DevTest] - Install ${{ variables.MODULE_NAME }} Module from Feed'
      inputs:
        azurePowerShellVersion: 'LatestVersion'
        azureSubscription: '${{ variables.AZURE_SERVICE_CONNECTION }}'
        FailOnStandardError: true
        pwsh: true
        ScriptType: 'InlineScript'
        Inline:  |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 #1
          $token = $env:SYSTEM_ACCESSTOKEN | ConvertTo-SecureString -AsPlainText -Force #2
          $credential = New-Object System.Management.Automation.PSCredential($env:SYSTEM_ACCESSTOKEN, $token) #3
          $sourceName = "${{ variables.ARTIFACT_FEED_NAME }}" #4
          $feedLocation = "$(ARTIFACT_FEED_BASE)/nuget/v2" #5

          Write-Host "##[section]Register Package Source"
          $params = @{
            Name = $sourceName
            ProviderName = "PowerShellGet"
            Location = $feedLocation
            Trusted = $true
            Credential = $credential
            Force = $true
          }
          Register-PackageSource @params #6

          Write-Host "##[section]Install Module"
          $moduleName = "${{ variables.MODULE_NAME }}" #7
          # -AllowPrerelease so the smoke test can resolve prerelease publishes.
          Install-Module -Name $moduleName -Repository $sourceName -Force -Credential $credential -AllowPrerelease

          if (-not (Get-Module -ListAvailable -Name $moduleName)) {
            Write-Error "Module [$moduleName] not imported."
          } else {
            Write-Host "Module '$moduleName' imported successfully - v$($(Get-Module -ListAvailable -Name $moduleName).Version)"
          }
