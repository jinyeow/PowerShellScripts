name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Import-Module PSScriptAnalyzer

          # Scope is deliberately narrow: recursing PSScriptAnalyzer over the whole
          # Scripts/ tree currently crashes on Scripts/Utility/New-NuspecFromPsd.ps1
          # (null-ref) and fails on pre-existing lint errors in Scripts/Server 2016/*.
          # Those are tracked separately - widen this Path once that tree is cleaned up.
          $params = @{
            Path = 'Scripts/AzureDevOps'
            Recurse = $true
            Settings = '.vscode/PSScriptAnalyzerSettings.psd1'
            ReportSummary = $true
            EnableExit = $true
          }
          Invoke-ScriptAnalyzer @params
